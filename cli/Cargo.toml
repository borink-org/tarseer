[package]
name = "tarseer-cli"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Walks a directory tree and prints it as JSON Lines, or writes the lines and an index as a zstd file"
repository = "https://github.com/borink-org/tarseer"

[[bin]]
name = "tarseer"
path = "src/main.rs"
# The library has the same name, and rustdoc writes both to one directory.
doc = false

[dependencies]
tarseer = { path = "..", version = "0.0.1" }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
error-stack = "0.8"
# Keep the existing allocator on platforms not covered by the Linux measurements.
[target.'cfg(not(target_os = "linux"))'.dependencies]
cyo-mimalloc = { git = "https://github.com/cyo-alloc/mimalloc" }

[lints]
workspace = true
