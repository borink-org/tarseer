[workspace]

[package]
name = "tarseer"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Parallel .tar.zst archiver + custom index with optimized file walking, parallelized tar creation and compression and random-access support"
repository = "https://github.com/borink-org/tarseer"
readme = "README.md"

[dependencies]
# The walk fans one task out per directory; this is the pool that runs them.
rayon = "1"
# Content digests. A real, audited implementation, and its own rayon feature is
# what parallelizes a single large file across cores.
blake3 = { version = "1", features = ["rayon"] }
# The index is columns of plain scalars and strings, so serializing it is a
# derive plus one adapter for the string tapes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI: builder API only, and default features off drops color, suggestions,
# wrap_help, unicode, env and derive.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }

# The Linux directory reader: getdents64 and a masked statx. `fs` is the one
# module of it this needs, and it is not pulled in anywhere else.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
