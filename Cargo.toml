[workspace]

[package]
name = "tarseer"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Walks a directory tree into memory-bounded parts and writes them as a compressed, indexed manifest: the source half of a parallel .tar.zst archiver"
repository = "https://github.com/borink-org/tarseer"
readme = "README.md"

[dependencies]
# The tree is columns of plain scalars and strings, so serializing it is a
# handful of small adapters over the rows rather than a shadow document.
# No `derive`: every impl here is hand-written anyway, and the feature would
# pull syn and proc-macro2 into the build for nothing.
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
# Each part is one-shot compressed into its own frame, and read back the same
# way, so the thin safe layer over libzstd is all that is needed; `std` for
# its `Vec` output buffers.
zstd-safe = { version = "7", features = ["std"] }
# CLI: builder API only, and default features off drops color, suggestions,
# wrap_help, unicode, env and derive.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
# Errors: a Report over a context type, with what happened attached to it.
# Chosen over snafu and stacked_errors because both hard-depend on a derive
# crate and so put syn in the graph unconditionally; this has no normal
# dependencies at all, and its own macros are declarative. Default features
# are std + backtrace, neither of which pulls a crate in.
error-stack = "0.8"
# The binary's global allocator; the library does not set one. Linked for
# library users too until the CLI's dependencies move behind a feature.
#
# mimalloc V3 (3.5.3 at the pinned commit), Linux only, and with no Cargo features at all: it is
# configured through the environment of the build that produces the binary,
# so nothing in the dependency graph can turn a mode on for the whole program.
#
# At its defaults it holds more than glibc here, and most of the difference is
# freed memory it keeps. Peak RSS walking /nix/store (1.86M entries, 4 MiB
# budget), and writing the same walk as a manifest (2 threads, level 9, the
# default window), measured 2026-09-19:
#
#                                 walk    manifest
#   glibc                        25 MB       42 MB
#   defaults                     63 MB      116 MB
#   MIMALLOC_PURGE_DELAY=0       34 MB       73 MB
#   + MIMALLOC_ARENA_EAGER_COMMIT=0
#                                23 MB       43 MB
#
# 3.5.3 measures within noise of the `mimalloc` crate's 3.3.2. Most of the
# manifest column is zstd's compression
# contexts, which come from the C allocator, not this one.
#
# Git until it is published.
cyo-mimalloc = { git = "https://github.com/cyo-alloc/mimalloc" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
