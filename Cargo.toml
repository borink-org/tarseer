[workspace]
members = ["cli"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[package]
name = "tarseer"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Walks a directory tree into memory-bounded parts and writes them, with an index, as JSON Lines in a zstd file"
repository = "https://github.com/borink-org/tarseer"
readme = "README.md"

[features]
default = ["zstd"]
# The zstd codec and file format: the `zstd` module. Without it the crate has
# the walk, the parts, their JSON, and the `Codec` and `Format` traits.
zstd = ["dep:zstd-safe"]

[dependencies]
# The tree is columns of plain scalars and strings, so serializing it is a
# handful of small adapters over the rows rather than a shadow document.
# No `derive`: every impl here is hand-written anyway, and the feature would
# pull syn and proc-macro2 into the build for nothing.
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
# Each part is one-shot compressed into its own frame, and read back the same
# way, so the thin safe layer over libzstd is all that is needed; `std` for
# its `Vec` output buffers.
zstd-safe = { version = "7", features = ["std"], optional = true }
# Errors: a Report over a context type, with what happened attached to it.
# Chosen over snafu and stacked_errors because both hard-depend on a derive
# crate and so put syn in the graph unconditionally; this has no normal
# dependencies at all, and its own macros are declarative. Default features
# are std + backtrace, neither of which pulls a crate in.
error-stack = "0.8"

[dev-dependencies]
# For the LZ4 format in examples/lz4, which shows a format written outside
# this crate.
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-encode", "safe-decode", "frame"] }
# The tests check what a plain zstd decoder makes of a file.
zstd-safe = { version = "7", features = ["std"] }

[lints]
workspace = true
