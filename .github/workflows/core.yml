name: core

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: clippy, rustfmt

      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # tests/tools.rs runs `zstd` and `jq`, and skips where they are missing.
      # Here they must be present.
      - run: cargo test --locked --workspace
        env:
          TARSEER_REQUIRE_TOOLS: 1
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps

      # The `std::fs` directory reader, which other platforms use.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg tarseer_portable_reader
      - run: cargo test --locked --workspace
        env:
          RUSTFLAGS: --cfg tarseer_portable_reader

      # The library without the zstd feature.
      - run: cargo clippy --locked -p tarseer --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked -p tarseer --no-default-features
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked -p tarseer --no-default-features --no-deps

  # Windows has its own directory reader, which only a Windows build covers.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: clippy

      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  # tarseer-nt's unit tests under Miri, on the Windows target. They run the
  # calls into the system against stand-ins that use every byte the calls
  # may, so Miri checks what the calls are given.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly branch
        with:
          components: miri, rust-src

      - run: cargo miri test --locked -p tarseer-nt --lib --target x86_64-pc-windows-msvc
